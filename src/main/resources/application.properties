# Public portfolio defaults: local machine only. Set credentials in your shell.
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_enterprise_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:student_enterprise_demo}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${UPLOAD_DIR:./uploads}
file.upload.dir=${UPLOAD_DIR:./uploads}
